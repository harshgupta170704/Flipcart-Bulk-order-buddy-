# Serves the built SPA and proxies the API/WebSocket to the backend container,
# so the browser only ever talks to one origin and CORS never comes into play.

# The access log without query strings (audit F-29, F-20). A query string can
# hold the archive download's token or the ledger's card filter, and nginx's
# usual format logs "$request", the request line as sent, query and all; $uri
# is the path alone (for an app page served by the index.html fallback below,
# the path it ended on: /index.html). The Referer is left out for the same
# reason: it is a whole address, query string included. This file is installed
# as conf.d/default.conf, inside nginx's http block, which is where log_format
# belongs: outside server.
log_format no_query '$remote_addr - $remote_user [$time_iso8601] '
                    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                    '"$http_user_agent"';

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Behind a TLS proxy or a load balancer (audit F-30), every connection
    # comes from that hop: $remote_addr, the one address the API is told below
    # and counts wrong passwords by, would be the same for every browser, and
    # fifty wrong ones from anywhere would lock everyone out.
    # ORDERING_TRUSTED_PROXIES names those hops (the web service in
    # docker-compose.yml; which values, docs/DEPLOY.md §4 "TLS"). At every
    # start docker-entrypoint.d/40-trusted-proxies.sh renders this file into
    # the config with, under the marker below, a set_real_ip_from line for
    # each, then real_ip_header X-Forwarded-For and real_ip_recursive on. For a
    # connection from a named hop, $remote_addr is then the browser's address
    # (in the access log too), read from the right of that header past every
    # named hop — so never one a browser wrote into the header itself,
    # provided each named hop writes the header itself (DEPLOY.md §4 "TLS").
    # Unset, nothing is added: the config is this file exactly.
    # @ORDERING_TRUSTED_PROXIES@

    # Here, not beside log_format: an access_log in the http block would log
    # alongside the image's own (format "main", the whole request line) rather
    # than instead of it. Same file, which the nginx image sends to stdout.
    access_log /var/log/nginx/access.log no_query;
    # nginx's error log has no format to choose: a request that fails on its
    # way to the API (the API stopped or restarting, a timeout) is written
    # with its whole request line, query string and all — the archive
    # download's token, the ledger's card filter (audit F-29, F-20). So this
    # server's error log keeps critical lines only. Such a failure still shows
    # in the access log above, as a 502 or a 504 with its path, and the API
    # logs its own side; nginx's own start-up errors still reach the image's
    # main error log, which this does not touch.
    error_log /var/log/nginx/error.log crit;

    # Browser hardening (audit F-29, 25 Oct 2026): no guessing of file types,
    # no framing of this app by another site, and no referrer sent onwards —
    # a reset link or a download link carries a token in its address.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # Only the app's own scripts run, so a script slipped into a page (a
    # product name, an address) cannot read the sign-in token the page keeps.
    # Product pictures come from Flipkart's image hosts; the live run view's
    # socket goes back to this same server ('self'); styles may be inline
    # because the page's components set them.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.flixcart.com https://*.flipkart.com; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    client_max_body_size 25m;  # card/account spreadsheet uploads

    # Invoices: PDF uploads come in by the hundred, and a compiled archive goes
    # out at a gigabyte or more — streamed straight through, never buffered to
    # disk, with a read timeout long enough for a slow link.
    # X-Forwarded-For carries exactly one address: $remote_addr, the peer
    # nginx sees, or the browser behind a proxy ORDERING_TRUSTED_PROXIES names
    # (the realip lines near the top). Never $proxy_add_x_forwarded_for here —
    # that APPENDS to whatever the browser sent, and a browser on a private
    # address (an office LAN, the docker host) could then name any address it
    # liked for the sign-in throttle.
    location /api/invoices/ {
        proxy_pass http://api:8000/invoices/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 500m;
    }

    # Card sheets: an order run's Start, and its card preview. Card data is
    # never written to disk (PLAN.md §5), and nginx writes a request body
    # bigger than its memory buffer (8-16 KB, a sheet of a hundred cards or
    # so) to a temp file before passing it on, so these two stream the body
    # to the API as it comes. A sheet is a few KB, and the API's form reader
    # writes a file part over 1 MiB to disk, so a body over 1m is refused here
    # from the size it declares, and none of it is kept.
    # The account import, the sheet of order ids to track and the order
    # report stream the body too, for the same reason: each can be handed
    # the owner's workbook in the legacy layout, whose columns T to W hold
    # every account's card number, expiry and CVV. The workbook of every
    # account is about 2 MB, so these three keep the 25m cap, and the API
    # reads their form in memory up to that. Exact matches: every other route under /api/ stays with the
    # location below.
    location = /api/jobs/order {
        proxy_pass http://api:8000/jobs/order;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        client_max_body_size 1m;
    }

    location = /api/jobs/order/card-preview {
        proxy_pass http://api:8000/jobs/order/card-preview;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        client_max_body_size 1m;
    }

    location = /api/accounts/import {
        proxy_pass http://api:8000/accounts/import;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        client_max_body_size 25m;
    }

    location = /api/orders/import-ids {
        proxy_pass http://api:8000/orders/import-ids;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        client_max_body_size 25m;
    }

    location = /api/orders/import-report {
        proxy_pass http://api:8000/orders/import-report;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        client_max_body_size 25m;
    }

    # /api/jobs -> http://api:8000/jobs   (the /api prefix is stripped)
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        # A big answer to a slow browser (the ledger's CSV carries full card
        # numbers) passes through memory, never a temp file on disk.
        proxy_max_temp_file_size 0;
    }

    # Live job progress — prefix preserved: /ws/jobs/1 -> http://api:8000/ws/jobs/1
    location /ws/ {
        proxy_pass http://api:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback — client-side routes resolve to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
