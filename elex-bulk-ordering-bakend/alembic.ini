# Alembic: the schema migrations for PostgreSQL (docs/DEPLOY.md §5).
#
# Run from backend/. From anywhere else (with -c path/to/alembic.ini), set
# ORDERING_DATABASE_URL: the default address is a file relative to the
# folder you are in, and alembic/env.py refuses it outside backend/ rather
# than work on some other ordering.db.
#   alembic upgrade head      bring a database up to the current models
#   alembic current           which revision a database is at
#   alembic check             does the database match the models? (needs head)
#
# There is deliberately no sqlalchemy.url here. alembic/env.py takes the
# address from the app's own settings (ORDERING_DATABASE_URL, or .env beside
# the app), so a migration can only ever reach the database the app itself
# would use, and a password is never written into this file.

[alembic]
# Where the migration scripts live, relative to this file.
script_location = %(here)s/alembic

# Revision files are named <rev>_<slug>.py. Give each new revision the next
# number as its id, so "alembic stamp 0001" and the file names read in order:
#   alembic revision --autogenerate --rev-id 0003 -m "what changed"
file_template = %%(rev)s_%%(slug)s

# The folder this file is in goes on sys.path, so "import app" works from any
# working directory (the image runs it from /app, a developer from backend/).
prepend_sys_path = %(here)s
path_separator = os

# Revision files are text, written as UTF-8.
output_encoding = utf-8


# Logging, used only when Alembic runs as a command: alembic/env.py leaves a
# program that calls Alembic from inside (the test suite, app.db.migrations)
# with its own logging untouched.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
